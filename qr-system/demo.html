<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Self-refreshing QR — display demo</title>

  <!-- Reference display page for the FRONTEND TEAM.
       It shows the exact integration: subscribe to /events, redraw the QR
       from `verifyUrl` on every push. Uses qrcodejs from a CDN just for the
       demo — swap for whatever QR library your app already uses.
       Open it after starting the backend (npm start). If the backend runs on
       a different host/port, change BACKEND below. -->
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

  <style>
    :root { color-scheme: light dark; }
    body { margin:0; min-height:100vh; display:grid; place-items:center;
      font-family:-apple-system,Segoe UI,Roboto,sans-serif;
      background:#0f172a; color:#e2e8f0; }
    .stage { text-align:center; }
    .frame { background:#fff; padding:20px; border-radius:20px; display:inline-block;
      box-shadow:0 20px 60px rgba(0,0,0,.5); }
    h1 { font-size:1.1rem; font-weight:600; margin:0 0 1.25rem; letter-spacing:.02em; }
    .meta { margin-top:1rem; font-size:.8rem; color:#94a3b8; }
    .dot { display:inline-block; width:8px; height:8px; border-radius:50%;
      background:#22c55e; margin-right:6px; vertical-align:middle; }
    .dot.off { background:#ef4444; }
  </style>
</head>
<body>
  <div class="stage">
    <h1>Scan to continue</h1>
    <div class="frame"><div id="qr"></div></div>
    <div class="meta"><span id="dot" class="dot off"></span><span id="status">connecting…</span></div>
  </div>

  <script>
    // ── change this to point at your backend ──
    const BACKEND = location.origin.includes("4000")
      ? location.origin
      : "http://localhost:4000";

    const box = document.getElementById("qr");
    const dot = document.getElementById("dot");
    const status = document.getElementById("status");
    const qr = new QRCode(box, { width: 256, height: 256, correctLevel: QRCode.CorrectLevel.M });

    let count = 0;

    const es = new EventSource(`${BACKEND}/events`);

    es.addEventListener("token", (e) => {
      const { verifyUrl } = JSON.parse(e.data);
      qr.clear();
      qr.makeCode(verifyUrl);       // <-- the one line that matters
      count += 1;
      dot.classList.remove("off");
      status.textContent = `live · refreshed ${count}×`;
    });

    es.onopen = () => { dot.classList.remove("off"); status.textContent = "live"; };
    es.onerror = () => { dot.classList.add("off"); status.textContent = "reconnecting…"; };
  </script>
</body>
</html>
