<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>IVS Admin</title>
    <link rel="stylesheet" href="admin.css" />
  </head>
  <body>
    <!-- Login -->
    <section id="login-view" class="login-wrap hidden">
      <form id="login-form" class="card login-card">
        <h1>IVS Admin</h1>
        <p class="muted">Sign in to manage settings and view activity.</p>
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="username" required />
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" required />
        <button type="submit" class="primary">Sign in</button>
        <p id="login-error" class="error hidden"></p>
      </form>
    </section>

    <!-- Dashboard -->
    <section id="app-view" class="hidden">
      <header class="topbar">
        <strong>IVS Admin</strong>
        <div class="topbar-right">
          <span id="admin-email" class="muted"></span>
          <button id="logout" class="ghost">Sign out</button>
        </div>
      </header>

      <main class="container">
        <div id="stats" class="stats"></div>

        <div class="card">
          <h2>Settings</h2>
          <p class="muted">Changes take effect across the API within a few seconds. No restart needed.</p>
          <div id="settings"></div>
          <p id="settings-status" class="status hidden"></p>
        </div>

        <div class="card">
          <nav class="tabs">
            <button class="tab active" data-tab="transactions">Transactions</button>
            <button class="tab" data-tab="imei">IMEI checks</button>
          </nav>

          <div id="tab-transactions" class="tab-panel">
            <div class="filters">
              <select id="txn-type">
                <option value="">All types</option>
                <option value="CREDIT">Credit</option>
                <option value="DEBIT">Debit</option>
              </select>
              <select id="txn-reason">
                <option value="">All reasons</option>
                <option value="TOPUP">Top-up</option>
                <option value="FEATURE_CHARGE">Feature charge</option>
                <option value="REFUND">Refund</option>
                <option value="REFERRAL_BONUS">Referral bonus</option>
                <option value="WELCOME_BONUS">Welcome bonus</option>
                <option value="ADJUSTMENT">Adjustment</option>
              </select>
            </div>
            <div class="table-scroll"><table id="txn-table"></table></div>
            <div class="pager" id="txn-pager"></div>
          </div>

          <div id="tab-imei" class="tab-panel hidden">
            <div class="filters">
              <select id="imei-status">
                <option value="">All statuses</option>
                <option value="CLEAN">Clean</option>
                <option value="BLOCKED">Blocked</option>
                <option value="STOLEN">Stolen</option>
                <option value="UNKNOWN">Unknown</option>
                <option value="ERROR">Error</option>
              </select>
            </div>
            <div class="table-scroll"><table id="imei-table"></table></div>
            <div class="pager" id="imei-pager"></div>
          </div>
        </div>
      </main>
    </section>

    <script src="admin.js"></script>
  </body>
</html>
